name: Native package and cache validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-15
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Vite+ owns the JavaScript environment, including the cache helper.
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          run-install: false
      - name: Install project JavaScript environment
        run: vp env install
      - name: Install locked application dependencies
        run: vp install --frozen-lockfile
      - uses: DeterminateSystems/nix-installer-action@v21
      - name: Assert native Nix platform
        env:
          EXPECTED_SYSTEM: ${{ matrix.system }}
        run: test "$(nix eval --impure --raw --expr builtins.currentSystem)" = "$EXPECTED_SYSTEM"
      - name: Configure optional signed binary cache
        env:
          CACHE_URL: ${{ vars.NIX_CACHE_URL }}
          CACHE_PUBLIC_KEY: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
          CACHE_USERNAME: ${{ secrets.NIX_CACHE_USERNAME }}
          CACHE_PASSWORD: ${{ secrets.NIX_CACHE_PASSWORD }}
        run: vp run cache:configure
      - name: Evaluate pinned packages
        run: vp run nix:check
      - name: Build and smoke-test native packages
        run: vp run nix:smoke
      - name: Check, build, and test the cache
        run: vp run ci
