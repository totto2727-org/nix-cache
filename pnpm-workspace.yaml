packages:
  - .

catalog:
  vite-plus: 1.7.0

minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

# Vite+ requires its matching Vite core and Vitest versions.
overrides:
  'vite@*': npm:@voidzero-dev/vite-plus-core@8.3.8000
  'vitest@*': 5.1.0

allowBuilds:
  vite-plus: false
  # Miniflare's real workerd runtime validates its platform binary during installation.
  workerd: true
